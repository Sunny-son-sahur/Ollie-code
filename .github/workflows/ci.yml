name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner ships ~14 GB free; the all-target CLI build plus node_modules
      # overflows it mid-build (the diag log itself failed to write). Reclaim
      # the preinstalled toolchains before anything installs.
      - name: Free disk before build
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx oxlint

      - name: Typecheck (cli)
        run: bun run --cwd packages/cli typecheck

      - name: Build cli
        env:
          OPENCODE_CHANNEL: local
        run: bun run --cwd packages/cli build --outdir=dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-all-targets
          path: packages/cli/dist/*
          if-no-files-found: error
